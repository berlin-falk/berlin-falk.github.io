<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THISISSOMETHINGIHAVEFOUND</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .countdown {
      width: 100%;
      max-width: 700px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      text-align: center;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .label {
      font-size: 12px;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .value {
      font-size: clamp(22px, 4vw, 28px);
      line-height: 1;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 560px) {
      .countdown {
        gap: 12px;
      }

      .label {
        font-size: 10px;
      }

      .value {
        font-size: clamp(18px, 6vw, 24px);
      }
    }
  </style>
</head>
<body>
  <div class="countdown" aria-label="Countdown to Monday, September 21 at 22:00 local time">
    <div class="unit">
      <div class="label">Days</div>
      <div class="value" id="days">00</div>
    </div>

    <div class="unit">
      <div class="label">Hours</div>
      <div class="value" id="hours">00</div>
    </div>

    <div class="unit">
      <div class="label">Minutes</div>
      <div class="value" id="minutes">00</div>
    </div>

    <div class="unit">
      <div class="label">Seconds</div>
      <div class="value" id="seconds">00</div>
    </div>
  </div>

  <script>
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function getTargetDate() {
      return new Date(2026, 8, 21, 22, 0, 0, 0);
    }

    function updateCountdown() {
      const now = new Date();
      const target = getTargetDate();
      const diff = target - now;

      if (diff <= 0) {
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
